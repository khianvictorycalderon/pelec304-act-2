{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{% block title %}{% endblock %}</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <script src="{% static 'js/tailwind-3.4.17.js' %}"></script>
        <script>
            tailwind.config = {
                theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } },
            };
        </script>
    </head>

    <body class="bg-slate-800 bg-cover bg-fixed bg-center font-sans text-slate-900 antialiased"
          style="background-image: url('{% static 'images/bg.jpg' %}')">
        <div class="min-h-screen bg-gradient-to-b from-slate-950/10 to-slate-950/40">
            {% block content %}
            {% endblock %}
        </div>
    </body>
</html>
